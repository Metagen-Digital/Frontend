name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # No live backend is needed: this is a pure SSR build with no
      # nitro.prerender / build-time data fetching, and every
      # NUXT_PUBLIC_* runtime var has a working default in nuxt.config.ts.
      # Pulls the shared auth layer from `extends: ['github:Metagen-Digital/
      # Shared#main']` (see nuxt.config.ts) — Actions runners can reach
      # GitHub, so this resolves the same way a real deploy does. If that
      # layer's repo is ever made private, this step needs a checkout token.
      - name: Build
        run: npm run build

  # No test suite exists yet for this app (no vitest/jest configured) — this
  # workflow currently only proves the build doesn't break. Add a `test` job
  # here once component/e2e tests exist.
